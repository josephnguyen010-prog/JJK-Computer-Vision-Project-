<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jujutsu Kaisen Computer Vision Project</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1c1a24;
    --line: #3c3844;
    --text: #ece9f2;
    --muted: #9a94a8;
    --accent: #ff5a78;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    gap: 16px;
  }

  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  p.lede { margin: 0; color: var(--muted); text-align: center; max-width: 60ch; }

  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    width: min(100%, 1200px);
    aspect-ratio: 32 / 9;
  }

  /* Below ~800px the two panels stack, so each keeps a usable size. */
  @media (max-width: 800px) {
    .stage { grid-template-columns: 1fr; aspect-ratio: 8 / 9; }
  }

  .panel {
    position: relative;
    background: var(--panel);
    display: grid;
    place-items: center;
    min-height: 0;
  }

  canvas { width: 100%; height: 100%; display: block; }

  #portrait {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 180ms ease;
  }
  #portrait.visible { opacity: 1; }

  #hint { position: absolute; color: var(--muted); font-size: 0.9rem; padding: 16px; text-align: center; }

  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }

  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }

  #status { color: var(--muted); font-size: 0.9rem; min-height: 1.5em; text-align: center; }

  #readout {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    white-space: pre;
    display: none;
  }
  #readout.visible { display: block; }

  video { display: none; }
</style>
</head>
<body>

<h1>Jujutsu Kaisen Computer Vision Project</h1>
<p class="lede">
  Throw a sign at the camera and hold it. Nothing leaves your machine &mdash; the
  camera feed and the model both run in this tab.
</p>

<div class="stage">
  <div class="panel">
    <canvas id="camera"></canvas>
    <span id="hint">Camera off</span>
  </div>
  <div class="panel">
    <img id="portrait" alt="" />
  </div>
</div>

<div class="controls">
  <button id="start">Start camera</button>
  <button id="skeleton" class="secondary" disabled>Hide hands</button>
  <button id="debug" class="secondary" disabled>Show readout</button>
</div>

<div id="status"></div>
<pre id="readout"></pre>

<video id="video" playsinline muted></video>

<script type="module">
  import { SignDemo } from "./app.js";

  const elements = {
    video: document.getElementById("video"),
    canvas: document.getElementById("camera"),
    portrait: document.getElementById("portrait"),
    hint: document.getElementById("hint"),
    start: document.getElementById("start"),
    skeleton: document.getElementById("skeleton"),
    debug: document.getElementById("debug"),
    status: document.getElementById("status"),
    readout: document.getElementById("readout"),
  };

  let demo = null;
  let loaded = false;
  let shownPortrait = null;
  let frames = 0;
  let fpsMark = performance.now();
  let fps = 0;

  function onState(state) {
    frames += 1;
    const now = performance.now();
    if (now - fpsMark > 500) {
      fps = Math.round((frames * 1000) / (now - fpsMark));
      frames = 0;
      fpsMark = now;
    }

    // The video is live well before the models finish downloading, so say so
    // rather than looking like a demo that detects nothing.
    if (state.loading) {
      elements.status.textContent = "Loading the hand tracker…";
      return;
    }
    if (!loaded) {
      loaded = true;
      elements.status.textContent = "Throw a sign and hold it.";
    }

    // Swap the <img> only when the sign changes. Reassigning src every frame
    // would restart the GIF continuously and it would never animate.
    const wanted = state.recognised ? state.label : null;
    if (wanted !== shownPortrait) {
      shownPortrait = wanted;
      if (wanted) {
        elements.portrait.src = `../assets/characters/${wanted}.gif`;
        elements.portrait.classList.add("visible");
      } else {
        elements.portrait.classList.remove("visible");
      }
    }

    if (elements.readout.classList.contains("visible")) {
      const ranked = [...state.classes.keys()]
        .sort((a, b) => state.probabilities[b] - state.probabilities[a])
        .slice(0, 3)
        .map((i) => `${state.classes[i].padEnd(20)}${state.probabilities[i].toFixed(2)}`);
      elements.readout.textContent = [
        ...ranked,
        `charge ${state.charge.toFixed(2)}`,
        `hands  ${state.handCount} (peak ${state.peakHands})    ${fps} fps`,
        `gate   ${demo?.handGate ? "on" : "OFF"}`,
      ].join("\n");
    }
  }

  elements.start.addEventListener("click", async () => {
    elements.start.disabled = true;
    elements.status.textContent = "Loading model and camera…";
    try {
      // ?gate=off disables the two-hand requirement, to test whether it is
      // what is blocking a sign.
      const handGate = new URLSearchParams(location.search).get("gate") !== "off";
      demo = new SignDemo({ video: elements.video, canvas: elements.canvas, onState, handGate });
      elements.hint.textContent = "Starting camera…";
      await demo.start();
      elements.hint.style.display = "none";
      elements.skeleton.disabled = false;
      elements.debug.disabled = false;
      elements.start.textContent = "Stop";
      elements.start.disabled = false;
      elements.start.onclick = () => location.reload();
    } catch (error) {
      elements.status.textContent =
        error.reason === "permission"
          ? "Camera permission denied. Allow it in your browser and reload."
          : error.message;
      elements.start.disabled = false;
    }
  });

  elements.skeleton.addEventListener("click", () => {
    demo.showSkeleton = !demo.showSkeleton;
    elements.skeleton.textContent = demo.showSkeleton ? "Hide hands" : "Show hands";
  });

  elements.debug.addEventListener("click", () => {
    const visible = elements.readout.classList.toggle("visible");
    elements.debug.textContent = visible ? "Hide readout" : "Show readout";
  });
</script>
</body>
</html>
